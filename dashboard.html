<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareLoop</title>
<style>
  :root {
    --bg:#f6f1e9; --card:#fffdf8; --ink:#241f1a; --muted:#7a6f63; --line:#e6dccd;
    --taken:#2f7d5b; --due:#c27a12; --missed:#b3372e; --up:#8a8175;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1815; --card:#252119; --ink:#f3ece1; --muted:#a79b8b; --line:#3a332a;
      --taken:#5fc596; --due:#e8b04a; --missed:#f0766b; --up:#9a9082; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 Georgia, 'Iowan Old Style', serif; }
  header { max-width:960px; margin:0 auto; padding:28px 20px 8px; display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  h1 { margin:0; font-size:28px; letter-spacing:-.5px; }
  h1 span { color:var(--taken); }
  .sub { color:var(--muted); font:14px system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; padding:12px 20px 48px; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .card h2 { margin:0; font-size:20px; }
  .rel { color:var(--muted); font:13px system-ui, sans-serif; margin-bottom:12px; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px solid var(--line); font:15px system-ui, sans-serif; }
  li small { color:var(--muted); display:block; }
  .pill { align-self:center; padding:2px 10px; border-radius:99px; font:600 12px system-ui, sans-serif; border:1px solid currentColor; white-space:nowrap; }
  .taken{color:var(--taken)} .due{color:var(--due)} .missed{color:var(--missed)} .upcoming,.skipped{color:var(--up)}
  .mood { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font:14px system-ui, sans-serif; color:var(--muted); }
  .empty { text-align:center; padding:60px 20px; color:var(--muted); grid-column:1/-1; font-family:system-ui, sans-serif; }
  code { background:var(--line); padding:1px 6px; border-radius:5px; }
</style>
</head>
<body>
<header>
  <h1>Care<span>Loop</span></h1>
  <div class="sub" id="stamp">loading…</div>
</header>
<main id="root"></main>
<script>
const root = document.getElementById('root');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = t => { const [h,m] = t.split(':').map(Number); return ((h+11)%12+1) + ':' + String(m).padStart(2,'0') + ' ' + (h<12?'AM':'PM'); };

async function load() {
  try {
    const d = await (await fetch('/api/overview')).json();
    document.getElementById('stamp').textContent = 'Live · updated ' + d.now.replace('T',' ');
    if (!d.people.length) {
      root.innerHTML = '<div class="empty">No one here yet. Ask Alexa+ to <code>add Nani to my care circle</code>.</div>';
      return;
    }
    root.innerHTML = d.people.map(p => `
      <section class="card">
        <h2>${esc(p.name)}</h2>
        <div class="rel">${esc(p.relationship || 'family')}</div>
        <ul>${p.doses.length ? p.doses.map(r => `
          <li><div>${esc(r.medication)} <small>${esc(r.dose)} · ${fmt(r.time)}${r.note ? ' · ' + esc(r.note) : ''}</small></div>
          <span class="pill ${r.status}">${r.status}</span></li>`).join('') : '<li>No medications scheduled</li>'}
        </ul>
        ${p.last_checkin ? `<div class="mood">Last check-in: mood ${p.last_checkin.mood}/5${p.last_checkin.symptoms ? ' · ' + esc(p.last_checkin.symptoms) : ''}</div>` : ''}
      </section>`).join('');
  } catch (e) {
    document.getElementById('stamp').textContent = 'offline: retrying…';
  }
}
load(); setInterval(load, 3000);
</script>
</body>
</html>
